services:
  app:
    build: .
    container_name: temucord_app
    ports:
      - "8080:80"
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: http://localhost:8080

      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: temucord
      DB_USERNAME: postgres
      DB_PASSWORD: 1234

      SESSION_DOMAIN: localhost
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: temucord_db
    environment:
      POSTGRES_DB: temucord
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"
    volumes:
      - temucord_pgdata:/var/lib/postgresql/data

volumes:
  temucord_pgdata: